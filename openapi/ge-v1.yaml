components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GateItemId:
      name: gate_item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PhaseId:
      name: phase_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProgramId:
      name: program_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ObjectiveId:
      name: objective_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
    NotFound:
      description: Not found or soft-deleted (detail project_not_found)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
    Conflict:
      description: State conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
  schemas:
    ErrorDetail:
      type: object
      required: [detail]
      properties:
