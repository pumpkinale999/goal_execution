openapi: 3.0.3
info:
  title: skstudio Project Governance (ge) API
  description: |
    **RUNTIME (GE-AUTHZ-API · 2026-08)**: This service exposes **only** `/api/v1/ge/*`.
    Auth: **service token** + `X-Actor-User-Id` + `X-Actor-Is-Reviewer` (0|1). User JWT rejected.
    Domain authz is in GE (no service god-mode). Browser reaches GE only via skstudio `/api/v1/ge/*`.
    Organization CRUD authority is **skstudio** `/api/v1/org/*` (not mounted here).
    Portfolios: `/ge/portfolios/*` (not `/org/.../goal-portfolio`).
    Portfolio authz (M8): Is-Reviewer or `X-Actor-Org-Portfolio-Department-Ids` / `…-Team-Ids`
    (+ `X-Target-Org-Department-Id` / `…-Team-Id` for user portfolio). See consensus §3.2 / §5.4.
    Health: `/ge/health`. Governor check: `/ge/goal-subtree-governor/check` (ignores reviewer).
    Callbacks (skstudio): `POST /api/v1/callbacks/ge/deviation-notify`.
    DB: **Postgres** (`DATABASE_URL` + `REQUIRE_POSTGRES=1`).

    Normative OpenAPI for P1 project governance domain (ge paths remain current).
    Full spec: platform-docs/目标与执行及其组织支撑(实现与测试).md §4.9 (+ 文首「现行运行时」)
    Business rules: platform-docs/目标与执行及其组织支撑(需求).md
    M20: system lifecycle tasks (启动项目/结项复盘/确认结项) · is_system on Task/GateItem
    M20b: 结项复盘 auto-seeded PM sign route (确认结项 prerequisite) · system_sign_route_immutable
    M21: permission simplification · PM=reviewer governance · not_project_governor
    v1.10.0: gate.includes auto-sync · POST/DELETE includes → 410 · Canvas produce/prerequisite only
    v1.10.2: end closure sign route auto-seed · protected prerequisite edge
    v1.11.0: M22 Deviation · open/activate/extend/cancel · graph is_overdue · queues deviation_actions
    v1.11.1: WriteOperationResponse.deviation · AffectedTask P3 fields · Deviation cancel snapshots · submit/done 409 deviation_not_activated
    v1.11.2: M22 deviation structure guards · produce unlink/rebind · patch deviated · delete remediation → 409 deviation_produce_immutable / task_deviated_immutable / remediation_task_not_deletable
    v1.12.0: REST-only workbench · DROP ge_execution_notifications · no skstudio ws-fanout
    v1.13.0 (P2 · M8): owner is_goal_subtree_governor · structural CRUD objectives/programs · service+Actor read/write · domain authz in GE (see impl §4.2.0.1)
    v1.14.0 (M23 · B′): Task effective_status read-time derivation (viewer/actor-relative) · actionable_tasks queue · Deprecated POST …/tasks/{id}/start|done · legacy ge_tasks.status stop-write · **spec draft ☑ · runtime pending**
    v1.15.0 (M24): can_govern_project includes is_goal_subtree_governor (GE-26 superseded) · graph write for steward · ProjectGraph graph_editable/graph_deletable
    v1.16.0 (v2.22/v2.23 · runtime ☑): user_org_memberships · primary_membership_id · membership CRUD · primary_membership_required 409 · see impl §4.1.3 · req v2.23.2 invariant
    v1.17.3 (M28): KB topic org-charter (title 组织宪章) · paths org-charter/departments|teams/{slug} · see impl §4.1.4 · req v2.24.4
    v1.18.0 (M29 · runtime ☑): period_* · lifecycle_status · primary_department_id · POST /ge/objectives/years · assess · planning_year readOnly response · see impl §4.2.0.4 · req v2.26.0
    v1.19.0 (M30/M31 · runtime ☑): people-summary · goal-portfolio · migrate-primary-objectives · DELETE department 409 department_has_primary_objectives · see impl §4.2.4 · §4.1.5 · req v2.27.0
    v1.20.0 (v2.28 · runtime ☑): Phase effective_planned_* · program_period on graph · phase_schedule_overlap · phase_schedule_outside_program · program_period_required · deviation extends Phase.planned_end · see req §4.8 · impl §4.3.2 · GE-T158
    v1.22.0 (M36-A · runtime ☑): queues ready · as_governor · GE-T169～T171
    v1.23.0 (M37 · runtime ☑): project-role-options · projects/{id}/members CRUD · ProjectMemberRow · see impl §4.2.5 · req v2.38.1
    v1.23.1 (M37 · PM roster role read-only): add/patch reject project_manager · cannot_change_pm_role · GE-T183～T185 · req v2.38.5
    v1.23.2 (M37 singleton roles): product/tech/test designer ≤1 · demote prior holder to member · singleton_role_conflict · GE-T186～T190 · req v2.38.10
    v1.24.0 (M38 · GA): POST /ge/objectives/years requires name · copy_from_objective_id · multiple company roots per year · see platform-docs M38 iter · req v2.38.22
    v1.25.0 (M39 MS1): CreateObjectiveYearRequest.owner_user_id optional · omit/blank → actor · see platform-docs M39 · impl §10.39
    v1.26.0 (GE-AUTHZ-API): X-Actor-Is-Reviewer · is_goal_subtree_governor · /ge/health · /ge/portfolios · /ge/goal-subtree-governor/check · /ge/users/{id}/project-access · no /ge-api
    v1.26.1 (GE-AUTHZ docs): consensus v0.1.9 · Org portfolio headers §3.2 · summaries service+Actor (no JWT participant wording)
    Out of scope: skstudio BFF orchestration /api/v1/org|ge/* · GE-AUTHZ consensus v0.1.9 (see impl §1.4 · §4.0 · §10.42)
  version: 1.27.0
servers:
  - url: /api/v1
    description: goal_execution service (service + Actor + Is-Reviewer only · GE-AUTHZ)
paths:

  /ge/health:
    get:
      operationId: geHealth
      summary: Process health (GE-AUTHZ E3)
      tags: [ge]
      responses:
        '200':
          description: ok / db_ok / service
  /ge/goal-subtree-governor/check:
    get:
      operationId: checkGoalSubtreeGovernor
      summary: Pure goal-tree governor query (ignores is_reviewer)
      tags: [ge]
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: objective_id
          in: query
          schema: { type: string }
        - name: program_id
          in: query
          schema: { type: string }
        - name: project_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: '{ is_governor: bool }'
  /ge/users/{user_id}/project-access:
    get:
      operationId: getUserProjectAccess
      summary: Batch project access table (K27.6 · service)
      tags: [ge]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string }
        - name: all_visible
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: '{ projects: [...] }'
  /org/departments:
    get:
      operationId: listOrgDepartments
      summary: Department tree (P0)
      tags: [org]
      responses:
        '200':
          description: Department tree
  /org/teams/{team_id}:
    patch:
      operationId: patchOrgTeam
      summary: Update team (service · reviewer BFF)
      tags: [org]
      parameters:
        - name: team_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated team
    delete:
      operationId: deleteOrgTeam
      summary: Delete team · unassign members (service · reviewer BFF)
      tags: [org]
      parameters:
        - name: team_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /org/departments/{department_id}:
    delete:
      operationId: deleteOrgDepartment
      summary: Delete department when no teams (service · reviewer BFF)
      tags: [org]
      parameters:
        - name: department_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '409':
          description: department_has_teams · department_has_primary_objectives (M31)
  /ge/portfolios/departments/{department_id}:
    get:
      operationId: getDepartmentGoalPortfolio
      summary: Department primary + participation rollup (M31 · service · BFF permission)
      tags: [org]
      parameters:
        - name: department_id
          in: path
          required: true
          schema: { type: string }
        - name: include_completed
          in: query
          schema: { type: integer, enum: [0, 1], default: 0 }
        - name: include_archived
          in: query
          schema: { type: integer, enum: [0, 1], default: 0 }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalPortfolio'
  /ge/portfolios/departments/{department_id}/migrate-primary-objectives:
    post:
      operationId: migrateDepartmentPrimaryObjectives
      summary: Batch retarget primary_department_id (M31 · reviewer BFF)
      tags: [org]
      parameters:
        - name: department_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_department_id]
              properties:
                target_department_id: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  objectives_migrated: { type: integer }
                  programs_migrated: { type: integer }
  /ge/portfolios/teams/{team_id}:
    get:
      operationId: getTeamGoalPortfolio
      summary: Team member participation rollup (M31)
      tags: [org]
      parameters:
        - name: team_id
          in: path
          required: true
          schema: { type: string }
        - name: include_completed
          in: query
          schema: { type: integer, enum: [0, 1], default: 0 }
        - name: include_archived
          in: query
          schema: { type: integer, enum: [0, 1], default: 0 }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalPortfolio'
  /ge/portfolios/users/{user_id}:
    get:
      operationId: getUserGoalPortfolio
      summary: User accountable + contributing portfolio (M31)
      tags: [org]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: include_completed
          in: query
          schema: { type: integer, enum: [0, 1], default: 0 }
        - name: include_archived
          in: query
          schema: { type: integer, enum: [0, 1], default: 0 }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalPortfolio'
  /org/members:
    get:
      operationId: listOrgMembers
      summary: All org member profiles (service token · BFF aggregate)
      tags: [org]
      responses:
        '200':
          description: Member list
  /org/users/{user_id}/profile:
    get:
      operationId: getOrgUserProfile
      summary: Read org profile (service+Actor self only; reviewer others via skstudio→GE)
      tags: [org]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User org profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOrgProfile'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patchOrgUserProfile
      summary: Update org scalars (service · reviewer BFF · v2.23 planning)
      tags: [org]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserOrgProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOrgProfile'
        '400':
          description: invalid_primary_membership
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /org/users/{user_id}/memberships:
    post:
      operationId: createOrgUserMembership
      summary: Add org membership row (service · reviewer BFF · v2.22 planning)
      tags: [org]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgMembershipRequest'
      responses:
        '201':
          description: Created membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMembership'
        '409':
          description: primary_membership_required
  /org/memberships/{membership_id}:
    delete:
      operationId: deleteOrgMembership
      summary: Remove one membership row (service · reviewer BFF · v2.22 planning)
      tags: [org]
      parameters:
        - name: membership_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /ge/objectives:
    get:
      operationId: listGeObjectives
      summary: Objective tree with nested program metadata (P2 · is_goal_subtree_governor sees full subtree via programs/projects; service+Actor)
      tags: [ge-objectives]
      responses:
        '200':
          description: Objective tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectiveNode'
    post:
      operationId: createGeObjective
      summary: Create sub-objective (P2 · service+Actor; is_goal_subtree_governor ∨ reviewer)
      tags: [ge-objectives]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateObjectiveRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectiveNode'
        '400':
          description: owner_required · validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
  /ge/objectives/{objective_id}:
    patch:
      operationId: patchGeObjective
      summary: Rename or transfer owner (P2 · service · default nodes protected)
      tags: [ge-objectives]
      parameters:
        - $ref: '#/components/parameters/ObjectiveId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchObjectiveRequest'
      responses:
        '200':
          description: Updated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: default_node_immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
    delete:
      operationId: deleteGeObjective
      summary: Delete empty non-default objective (P2 · has_children → 409)
      tags: [ge-objectives]
      parameters:
        - $ref: '#/components/parameters/ObjectiveId'
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: has_children · default_node_immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /ge/objectives/years:
    post:
      operationId: createGeObjectiveYear
      summary: Create top-level strategic objective tree for a planning year (M29 · M38 · reviewer · service token via BFF)
      tags: [ge-objectives]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateObjectiveYearRequest'
      responses:
        '201':
          description: Created company objective (top-level); optional subtree copy from copy_from_objective_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectiveNode'
        '400':
          description: validation · name_required · duplicate_annual_name · annual_root_limit_exceeded · copy_from_year_deprecated · copy_source_invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
  /ge/objectives/{objective_id}/reorder:
    post:
      operationId: reorderGeObjective
      summary: Reorder sibling sub-objectives (M32 · service+Actor; is_goal_subtree_governor ∨ reviewer)
      tags: [ge-objectives]
      parameters:
        - $ref: '#/components/parameters/ObjectiveId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
      responses:
        '200':
          description: Updated objective with normalized sort_order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectiveNode'
        '403':
          description: default_node_immutable · strategic_locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /ge/objectives/{objective_id}/assess:
    post:
      operationId: assessGeObjective
      summary: Assess strategic objective lifecycle (M29 · reviewer · pending_assessment only)
      tags: [ge-objectives]
      parameters:
        - $ref: '#/components/parameters/ObjectiveId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategicAssessRequest'
      responses:
        '200':
          description: Assessed objective (then archived)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectiveNode'
        '400':
          description: not pending_assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
  /ge/objectives/{objective_id}/people-summary:
    get:
      operationId: getObjectivePeopleSummary
      summary: People accountable/contributing rollup for objective subtree (M30)
      tags: [ge-objectives]
      parameters:
        - $ref: '#/components/parameters/ObjectiveId'
        - name: include_completed
          in: query
          schema: { type: integer, enum: [0, 1], default: 0 }
        - name: include_archived
          in: query
          schema: { type: integer, enum: [0, 1], default: 0 }
      responses:
        '200':
          description: PeopleSummary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /ge/programs:
    get:
      operationId: listGePrograms
      summary: Program list (metadata only)
      tags: [ge-programs]
      responses:
        '200':
          description: Program list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProgramMetadata'
    post:
      operationId: createGeProgram
      summary: Create non-default program (P2 · service+Actor; is_goal_subtree_governor ∨ reviewer)
      tags: [ge-programs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProgramRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramMetadata'
        '400':
          description: owner_required · objective_id required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
  /ge/programs/{program_id}:
    get:
      operationId: getGeProgram
      summary: Program detail with projects[] (service+Actor+Is-Reviewer; can_read_project (participant∪creator∪governor∨reviewer))
      tags: [ge-programs]
      parameters:
        - $ref: '#/components/parameters/ProgramId'
      responses:
        '200':
          description: Program detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patchGeProgram
      summary: Rename, owner, or migrate objective_id (P2 · service · default protected)
      tags: [ge-programs]
      parameters:
        - $ref: '#/components/parameters/ProgramId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProgramRequest'
      responses:
        '200':
          description: Updated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: default_node_immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
    delete:
      operationId: deleteGeProgram
      summary: Delete empty non-default program (P2 · has_children → 409)
      tags: [ge-programs]
      parameters:
        - $ref: '#/components/parameters/ProgramId'
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: has_children · default_node_immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /ge/programs/{program_id}/reorder:
    post:
      operationId: reorderGeProgram
      summary: Reorder sibling programs under sub-objective (M32 · service+Actor; is_goal_subtree_governor ∨ reviewer)
      tags: [ge-programs]
      parameters:
        - $ref: '#/components/parameters/ProgramId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
      responses:
        '200':
          description: Updated program with normalized sort_order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramMetadata'
        '403':
          description: default_node_immutable · strategic_locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /ge/programs/{program_id}/assess:
    post:
      operationId: assessGeProgram
      summary: Assess strategic program lifecycle (M29 · reviewer · pending_assessment only)
      tags: [ge-programs]
      parameters:
        - $ref: '#/components/parameters/ProgramId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategicAssessRequest'
      responses:
        '200':
          description: Assessed program (then archived)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramMetadata'
        '400':
          description: not pending_assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
  /ge/programs/{program_id}/people-summary:
    get:
      operationId: getProgramPeopleSummary
      summary: People rollup for program (M30)
      tags: [ge-programs]
      parameters:
        - $ref: '#/components/parameters/ProgramId'
        - name: include_completed
          in: query
          schema: { type: integer, enum: [0, 1], default: 0 }
        - name: include_archived
          in: query
          schema: { type: integer, enum: [0, 1], default: 0 }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /ge/projects:
    get:
      operationId: listGeProjects
      summary: List projects (service+Actor+Is-Reviewer; can_read_project (participant∪creator∪governor∨reviewer))
      tags: [ge-projects]
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSummary'
    post:
      operationId: createGeProject
      summary: Atomically create project graph (draft · default Program any user · non-default Program is_goal_subtree_governor P2)
      tags: [ge-projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
