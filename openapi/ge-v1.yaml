          extend: '#/components/schemas/ExtendDeviationRequest'
          cancel: '#/components/schemas/CancelDeviationRequest'
    ActivateDeviationRequest:
      type: object
      required: [action, remediation_due]
      description: >
        Confirm remediation due (time-first). Creates remediation task + produce rebind.
        reason / remediation_plan optional (narrative lives in PRA report note).
      properties:
        action:
          type: string
          enum: [activate]
        reason:
          type: string
          description: Optional; prefer PRA remediation report note
        remediation_plan:
          type: string
          description: Optional; prefer PRA remediation report note
        remediation_due:
          type: string
          format: date
        assignee_user_id:
          type: string
    ExtendDeviationRequest:
      type: object
      required: [action, remediation_due]
      properties:
        action:
          type: string
          enum: [extend]
        remediation_due:
          type: string
          format: date
        extend_reason:
          type: string
          description: Optional; Canvas clock / time-first path omits (audit records time_first)
        remediation_plan:
          type: string
          description: Required when revision >= 3 and extend_reason is provided (menu path)
    CancelDeviationRequest:
      type: object
      required: [action, cancel_reason]
      properties:
        action:
          type: string
          enum: [cancel]
        cancel_reason:
          type: string
    DeviationSummary:
      type: object
      required: [id, status, kind, revision]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [open, active, closed, cancelled]
        kind:
          type: string
          enum: [overdue, scope]
        revision:
          type: integer
        remediation_due:
          type: string
          format: date
          nullable: true
        remediation_task_id:
          type: string
          format: uuid
          nullable: true
          description: Null while Deviation is open (before activate creates task)
    Deviation:
      allOf:
        - $ref: '#/components/schemas/DeviationSummary'
        - type: object
          properties:
            gate_item_id:
              type: string
              format: uuid
            project_id:
              type: string
              format: uuid
            reason:
              type: string
              nullable: true
            remediation_plan:
              type: string
              nullable: true
            superseded_task_id:
              type: string
              format: uuid
            gate_item_status_at_open:
              type: string
              description: GateItem status snapshot at open · cancel rollback
            superseded_task_status_at_open:
              type: string
              description: Superseded task status snapshot at open · cancel rollback
            opened_by_user_id:
              type: string
            opened_at:
              type: string
              format: date-time
            activated_at:
              type: string
              format: date-time
              nullable: true
            cancelled_at:
              type: string
              format: date-time
              nullable: true
    AffectedTask:
      type: object
      required: [id, title, effective_status, assignee_user_id, phase_id]
      properties:
        id:
          type: string
        title:
          type: string
        effective_status:
          $ref: '#/components/schemas/TaskEffectiveStatus'
        status:
          type: string
          deprecated: true
          description: Legacy persisted column · stop-write M23
        assignee_user_id:
          type: string
        phase_id:
          type: string
        deviation_id:
          type: string
          format: uuid
          nullable: true
        is_remediation:
          type: boolean
        produces:
          type: array
          items:
            type: string
            format: uuid
          description: Produce edge gate_item ids · refreshed on rebind/cancel
    WriteOperationResponse:
      type: object
      required: [gate_item, affected_tasks, gate, phase, project]
      properties:
        gate_item:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/GateItemGraph'
        affected_tasks:
          type: array
          items:
            $ref: '#/components/schemas/AffectedTask'
        deviation:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DeviationSummary'
        gate:
          nullable: true
          type: object
          properties:
            id:
              type: string
            phase_id:
              type: string
            is_open:
              type: boolean
        phase:
          nullable: true
          type: object
          properties:
            id:
              type: string
            sequence:
              type: integer
            name:
              type: string
            status:
              type: string
        project:
          type: object
          required: [id, status]
          properties:
            id:
              type: string
            status:
              type: string
    QueueDeviationAction:
      type: object
      required: [action, project_id, project_name, gate_item_id, gate_item_name, phase_name]
      properties:
        action:
          type: string
          enum: [open, activate, extend]
        project_id:
          type: string
        project_name:
          type: string
        gate_item_id:
          type: string
        gate_item_name:
          type: string
        phase_name:
          type: string
        deviation_id:
          type: string
          nullable: true
        remediation_task_id:
          type: string
          nullable: true
        ready:
          type: boolean
          description: M36 · same Ready rule as QueueGateItem
        block_reason:
          type: string
          nullable: true
        phase_id:
          type: string
          nullable: true
        phase_effective_planned_start:
          type: string
          format: date
          nullable: true
        as_governor:
          type: boolean
    QueueGateItem:
      type: object
      required: [gate_item_id, gate_item_name, project_id, project_name, phase_name, ready]
      properties:
        gate_item_id:
          type: string
        gate_item_name:
          type: string
        project_id:
          type: string
        project_name:
          type: string
        phase_name:
          type: string
        submitted_by_user_id:
          type: string
          nullable: true
        ready:
          type: boolean
          description: M36 · phase effective planned_start ≤ today (Asia/Shanghai); missing start → true
        block_reason:
          type: string
          nullable: true
          description: M36 · not_yet_started when ready=false; else null
        phase_id:
          type: string
          nullable: true
        phase_effective_planned_start:
          type: string
          format: date
          nullable: true
        as_governor:
          type: boolean
          description: M36 · true when listed via can_govern_project proxy
    QueueActionableTask:
      type: object
      required: [task_id, task_title, project_id, project_name, phase_name, effective_status]
      properties:
        task_id:
          type: string
        task_title:
          type: string
        project_id:
          type: string
        project_name:
          type: string
        phase_name:
          type: string
        effective_status:
          $ref: '#/components/schemas/TaskEffectiveStatus'
    QueueReadyTask:
      deprecated: true
      description: Renamed to QueueActionableTask (M23)
      allOf:
        - $ref: '#/components/schemas/QueueActionableTask'
